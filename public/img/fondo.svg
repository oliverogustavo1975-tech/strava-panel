    <rect class="fg" x="57" y="-10" width="54" height="50"/><rect class="ln2" x="57" y="-10" width="54" height="50"/>
    <rect class="ft" x="111" y="-10" width="54" height="50"/><rect class="ln" x="111" y="-10" width="54" height="50"/>
    <rect class="fa" x="165" y="-10" width="54" height="50"/><rect class="ln3" x="165" y="-10" width="54" height="50"/>
    <rect class="ft" x="270" y="20" width="40" height="70"/><rect class="ln" x="270" y="20" width="40" height="70"/>
    <rect class="ft" x="310" y="0" width="62" height="90"/><rect class="ln" x="310" y="0" width="62" height="90"/>
    <path class="ln" d="M322 20 H360 M322 40 H360 M322 60 H360"/>
    <path class="ln" d="M341 0 V-28 M330 -18 H352"/>
    <path class="ln" d="M0 90 L500 90 L462 150 L48 150 Z"/>
