    <circle class="ft" cx="132" cy="112" r="15"/><circle class="ln" cx="132" cy="112" r="15"/>
    <path class="ln3" d="M40 70 L26 44 H90 L104 70"/>
    <path class="ln3" d="M50 56 L300 -120"/><path class="ln3" d="M64 60 L300 -108"/>
    <path class="ln3" d="M300 -120 V-40 M292 -40 H308 V-22 H292 Z"/>
    <path class="ln3" d="M50 56 L300 -108" opacity=".3"/>
