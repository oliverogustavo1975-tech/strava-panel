<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .ln{fill:none;stroke:#5B7C99;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
      .ln2{fill:none;stroke:#7A9A8C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
      .ln3{fill:none;stroke:#B98F5F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
      .ft{fill:#5B7C99;opacity:.10}
      .fg{fill:#7A9A8C;opacity:.13}
      .fa{fill:#B98F5F;opacity:.13}
      .route{fill:none;stroke:#5B7C99;stroke-width:1.6;stroke-dasharray:3 9;stroke-linecap:round;opacity:.30}
    </style>
  </defs>

  <!-- rutas entrecruzadas -->
  <path class="route" d="M-20 470 C 200 380, 380 560, 620 440 S 980 330, 1220 420"/>
  <path class="route" d="M-20 250 C 240 330, 420 170, 700 260 S 1000 420, 1220 300"/>
  <path class="route" d="M300 -20 C 380 200, 260 380, 380 560 S 480 700, 440 820"/>
  <path class="route" d="M880 -20 C 820 160, 960 300, 900 470 S 820 680, 900 820"/>

