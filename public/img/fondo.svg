    <rect class="fa" x="40" y="24" width="46" height="46"/><rect class="ln3" x="40" y="24" width="46" height="46"/>
    <rect class="fg" x="86" y="24" width="46" height="46"/><rect class="ln2" x="86" y="24" width="46" height="46"/>
    <rect class="ft" x="240" y="6" width="56" height="64"/><rect class="ln" x="240" y="6" width="56" height="64"/>
    <path class="ln" d="M-20 140 q20 -14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>
</svg>
