  <g transform="translate(210 210) rotate(-4)">
    <path class="fg" d="M20 70 H100 V30 H70 L50 0 H30 V70"/><path class="ln2" d="M20 70 H100 V30 H70 L50 0 H30 V70"/>
    <path class="ln2" d="M36 8 H48 L62 30 H36 Z"/>
    <path class="ln2" d="M-10 -34 V78 M6 -34 V78"/>
    <path class="ln2" d="M-10 78 H-58 M-10 66 H-52"/>
