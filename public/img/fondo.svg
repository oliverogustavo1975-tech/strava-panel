  <!-- camión pequeño (segundo plano) -->
  <g transform="translate(470 330) scale(.6) rotate(-6)">
    <rect class="ft" x="0" y="10" width="150" height="72"/><rect class="ln" x="0" y="10" width="150" height="72"/>
    <path class="ft" d="M160 82 V40 H194 L214 60 V82 Z"/><path class="ln" d="M160 82 V40 H194 L214 60 V82 Z"/>
    <circle class="ft" cx="34" cy="92" r="13"/><circle class="ln" cx="34" cy="92" r="13"/>
    <circle class="ft" cx="182" cy="92" r="13"/><circle class="ln" cx="182" cy="92" r="13"/>
