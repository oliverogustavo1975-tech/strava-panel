  <!-- grúa torre pequeña -->
  <g transform="translate(1040 90) scale(.7)">
    <path class="ln" d="M60 320 V0 M90 320 V0"/>
    <path class="ln" d="M60 40 L90 70 M60 80 L90 110 M60 120 L90 150 M60 160 L90 190 M60 200 L90 230 M60 240 L90 270 M60 280 L90 310"/>
    <path class="ln" d="M-90 0 H230 M-90 0 L75 -46 L230 0"/>
    <path class="ln" d="M-60 0 V50 H-30 V0"/>
    <path class="ln" d="M170 0 V70 M162 70 H178 V86 H162 Z"/>
    <rect class="ft" x="-2" y="320" width="154" height="16"/><rect class="ln" x="-2" y="320" width="154" height="16"/>
