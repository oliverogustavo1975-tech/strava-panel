    <path class="ln2" d="M0 96 H196"/>
    <path class="ln2" d="M40 10 V96 M80 10 V96 M120 10 V96 M160 10 V96"/>
    <path class="ft" d="M204 96 V50 H244 L268 72 V96 Z"/><path class="ln" d="M204 96 V50 H244 L268 72 V96 Z"/>
    <path class="ln" d="M216 56 H240 L256 72 H216 Z"/>
    <circle class="ft" cx="40" cy="106" r="15"/><circle class="ln" cx="40" cy="106" r="15"/><circle class="ln" cx="40" cy="106" r="5"/>
    <circle class="ft" cx="82" cy="106" r="15"/><circle class="ln" cx="82" cy="106" r="15"/><circle class="ln" cx="82" cy="106" r="5"/>
    <circle class="ft" cx="228" cy="106" r="15"/><circle class="ln" cx="228" cy="106" r="15"/><circle class="ln" cx="228" cy="106" r="5"/>
